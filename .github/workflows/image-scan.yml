# trivy will scan docker image after its built

name: Image Scanner

on:
    workflow_call:

jobs:
    image-scanner:
        runs-on: ubuntu-latest

        steps:

            - name: login to dockerhub
              uses: docker/login-action@v3
              with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

            - name: Trivy scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{vars.DOCKERHUB_USERNAME}}/github-actions-app:${{ github.sha }}
                severity: 'CRITICAL'
                exit-code: '1'
                trivyignores: .trivyignore