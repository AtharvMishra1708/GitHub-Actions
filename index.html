<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atharv Mishra | Platform & DevOps Infrastructure Engineer</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-deep: #030712;
            --bg-surface: #0b1329;
            --bg-card: #111c44;
            --cyan-glow: #06b6d4;
            --emerald-accent: #10b981;
            --royal-blue: #3b82f6;
            --text-ghost: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(6, 182, 212, 0.15);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            color: var(--text-ghost);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Glassmorphism Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 19, 41, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            padding: 15px 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--text-ghost);
        }

        .nav-logo span {
            color: var(--cyan-glow);
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--emerald-accent);
            color: var(--emerald-accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--emerald-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--emerald-accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 14px var(--emerald-accent); }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* Container Standard */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Hero / Showcase Hub */
        .hero {
            padding: 100px 0 60px 0;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: var(--cyan-glow);
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--text-ghost), #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h1 span {
            background: linear-gradient(to right, var(--cyan-glow), var(--royal-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-title-sub {
            font-size: 1.4rem;
            color: var(--cyan-glow);
            font-weight: 500;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 25px;
        }

        .contact-cluster {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .contact-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            color: var(--text-ghost);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--card-shadow);
        }

        .contact-btn:hover {
            border-color: var(--cyan-glow);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        /* Metrics Dash Layer */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .card-metric {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .card-metric:hover {
            border-color: rgba(6, 182, 212, 0.4);
        }

        .card-metric::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, var(--cyan-glow), var(--royal-blue));
        }

        .metric-num {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--text-ghost);
            font-family: 'Courier New', Courier, monospace;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Headings Configuration */
        .section-header {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 60px 0 30px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 10px;
        }

        .section-header i {
            color: var(--cyan-glow);
        }

        /* Core Skills Grid Matrix */
        .skills-grid-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
        }

        .skill-group-box {
            background: rgba(17, 28, 68, 0.3);
            border: 1px solid var(--border-glow);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }

        .skill-group-box h3 {
            font-size: 1.1rem;
            color: var(--text-ghost);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-group-box h3 i {
            color: var(--royal-blue);
        }

        .pill-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-pill {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.2s;
        }

        .skill-pill:hover {
            background: rgba(6, 182, 212, 0.1);
            border-color: var(--cyan-glow);
            color: var(--cyan-glow);
        }

        /* Timeline Execution Blocks */
        .timeline-track {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .timeline-node {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }

        .node-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .node-role {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .node-company {
            color: var(--cyan-glow);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .node-duration {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .node-logs {
            list-style: none;
        }

        .node-logs li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 12px;
            color: var(--text-muted);
