<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atharv Mishra | DevOps & Platform Engineer</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #151D30;
            --accent-green: #10B981;
            --accent-blue: #3B82F6;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --border: #24324D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header / Hero Section */
        header {
            padding: 80px 0 40px 0;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #0B0F19 0%, #111827 100%);
        }

        .header-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: var(--text-primary);
        }

        h1 span {
            color: var(--accent-green);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--accent-blue);
            font-weight: 600;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .contact-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .contact-item {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .contact-item:hover {
            color: var(--accent-green);
        }

        /* Metric Highlights */
        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 40px 0 20px 0;
        }

        .metric-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid var(--accent-green);
        }

        .metric-num {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 5px;
        }

        /* Section Layouts */
        section {
            padding: 40px 0;
        }

        .section-title {
            font-size: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-green);
        }

        /* Tech Skill Clusters */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .skill-category {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
        }

        .skill-category h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Experience Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .timeline-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 8px;
            position: relative;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .job-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .company-date {
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            gap: 15px;
        }

        .company-date span i {
            color: var(--accent-green);
            margin-right: 5px;
        }

        .bullet-list {
            list-style-type: none;
        }

        .bullet-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .bullet-list li::before {
            content: "➔";
            position: absolute;
            left: 0;
            color: var(--accent-green);
        }

        /* Projects Section */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 25px;
        }

        @media (max-width: 600px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }

        .project-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-name a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .project-name a:hover {
            color: var(--accent-green);
        }

        .project-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* Footer Certification Badges */
        .cert-badge {
            background: linear-gradient(45deg, #1E293B 0%, #0F172A 100%);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .cert-badge i {
            color: #F59E0B;
            font-size: 1.2rem;
        }
    </style>
</head>
